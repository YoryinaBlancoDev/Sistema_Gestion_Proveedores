<mat-card class="full-width">

  <mat-card-header class="card-header">
    <mat-card-title>Proveedores</mat-card-title>
    @if (puedeModificar) {
    <button
      mat-mini-fab
      matTooltip="Crear proveedor"
      aria-label="Crear proveedor"
      routerLink="/proveedores/create"
    >
      <mat-icon>add</mat-icon>
    </button>
  }
  </mat-card-header>

  <mat-card-content>
    <mat-form-field
  appearance="outline"
  class="filtro">

  <mat-label>Buscar proveedor</mat-label>

  <input
    matInput
    type="text"
    placeholder="Nombre, cédula, categoría o estado"
    (input)="aplicarFiltro($event)"
  >

  <mat-icon matSuffix>
    search
  </mat-icon>

</mat-form-field>
    <div class="mat-elevation-z2 table-container">

      <table
        mat-table
        [dataSource]="dataSource"
        class="full-width-table"
        matSort
        aria-label="Proveedores"
      >

        <!-- Categoría -->
        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
             Categoría
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.categoria?.nombre }}
          </td>
        </ng-container>

        <!-- Empresa -->
        <ng-container matColumnDef="nombre_empresa">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Empresa
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.nombre_empresa }}
          </td>
        </ng-container>

      

        <!-- Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>
            Acciones
          </th>

          <td mat-cell *matCellDef="let row">

            <button
              mat-icon-button
              matTooltip="Ver detalle"
              [routerLink]="['/proveedores/detail', row.id_proveedor]"
            >
              <mat-icon>visibility</mat-icon>
            </button>

            @if (puedeModificar) {
            <button
              mat-icon-button
              matTooltip="Editar"
              [routerLink]="['/proveedores/update', row.id_proveedor]"
            >
              <mat-icon>edit</mat-icon>
            </button>
          }

          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
        ></tr>

      </table>

      <mat-paginator
        #paginator
        [length]="dataSource.data.length"
        [pageIndex]="0"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20]"
        aria-label="Seleccionar página"
      >
      </mat-paginator>

    </div>

  </mat-card-content>

</mat-card>
