<mat-card class="list-card">

  <!-- Encabezado -->
  <mat-card-header class="list-header">

    <div class="header-content">

      <div>
        <mat-card-title>
          Categorías de proveedores
        </mat-card-title>

        <mat-card-subtitle>
          Administración de categorías de proveedores
        </mat-card-subtitle>
      </div>

      <button
        mat-raised-button
        type="button"
        class="btn-crear"
        (click)="crear()"
      >
        <mat-icon>add</mat-icon>
        Nueva categoría
      </button>

    </div>

  </mat-card-header>


  <mat-card-content>

    <!-- Buscador -->
    <div class="filtro-container">

      <mat-form-field
        appearance="outline"
        class="filtro"
      >

        <mat-label>
          Buscar categoría
        </mat-label>

        <mat-icon matPrefix>
          search
        </mat-icon>

        <input
          matInput
          type="text"
          placeholder="Nombre o descripción"
          (keyup)="aplicarFiltro($event)"
        />

      </mat-form-field>

    </div>


    <!-- Tabla -->
    <div class="table-container">

      <table
        mat-table
        [dataSource]="dataSource"
        matSort
      >

      <!-- ID -->
        <ng-container matColumnDef="id_categoria">

          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            ID
          </th>

          <td
            mat-cell
            *matCellDef="let categoria"
          >
            {{ categoria.id_categoria }}
          </td>

        </ng-container>

        <!-- Nombre -->
        <ng-container matColumnDef="nombre">

          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Nombre
          </th>

          <td
            mat-cell
            *matCellDef="let categoria"
          >
            {{ categoria.nombre }}
          </td>

        </ng-container>


        

        


        <!-- Acciones -->
        <ng-container matColumnDef="acciones">

          <th
            mat-header-cell
            *matHeaderCellDef
          >
            Acciones
          </th>

          <td
            mat-cell
            *matCellDef="let categoria"
          >

            <div class="acciones">

              <!-- Detalle -->
              <button
                mat-icon-button
                type="button"
                matTooltip="Ver detalle"
                aria-label="Ver detalle de categoría"
                (click)="detalle(categoria.id_categoria)"
              >
                <mat-icon>
                  visibility
                </mat-icon>
              </button>


              <!-- Editar -->
              <button
                mat-icon-button
                type="button"
                matTooltip="Editar"
                aria-label="Editar categoría"
                (click)="editar(categoria.id_categoria)"
              >
                <mat-icon>
                  edit
                </mat-icon>
              </button>

            </div>

          </td>

        </ng-container>


        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>

        <tr
          mat-row
          *matRowDef="
            let row;
            columns: displayedColumns
          "
        ></tr>

      </table>


      <!-- Sin resultados -->
      @if (dataSource.filteredData.length === 0) {

        <div class="sin-resultados">

          <mat-icon>
            category
          </mat-icon>

          <span>
            No se encontraron categorías.
          </span>

        </div>

      }

    </div>


    <!-- Paginador -->
    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Seleccionar página de categorías"
    >
    </mat-paginator>

  </mat-card-content>

</mat-card>
